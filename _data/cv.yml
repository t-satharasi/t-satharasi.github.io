    Experience:
      - company: University of Florida
        position: Graduate Research Assistant
        location: Gainesville, FL, USA
        start_date: 2024-08
        end_date: 2026-05
        summary: >
          Research under Prof. Rushikesh Kamalapurkar on nonlinear,
          adaptive, safety-critical, and learning-based control.
        highlights:
          - "Designed and implemented a reusable ROS 2 navigation framework for nonholonomic ground robots, enabling experimental validation of scalar-field mapping algorithms and supporting multiple journal manuscripts."
          - "Developed and validated obstacle-avoidance controllers under partial-state feedback through simulation and quadrotor experiments."
          - "Developed reinforcement-learning-based control policies for safe navigation under uncertain dynamics while enforcing obstacle-avoidance constraints."
          - "Mentored a high-school intern in experimental setup using Raspberry Pi, Ubuntu, and ROS 2."

      - company: University of Florida
        position: Graduate Teaching Assistant
        location: Gainesville, FL, USA
        start_date: 2025-08
        end_date: 2025-12
        summary: >
          Teaching assistant under Prof. Amor A. Menezes.
        highlights:
          - "Supported a graduate Control Systems Theory course by grading coursework, providing feedback, and clarifying course material."
          - "Served as a teaching assistant for Introduction to Aerospace Engineering, administering quizzes, grading submissions, and answering student questions."

      - company: National Center for Combustion Research and Development, IIT Madras
        position: Undergraduate Research Assistant
        location: Chennai, India
        start_date: 2022-01
        end_date: 2024-01
        highlights:
          - "Created and fabricated 3D door models in SolidWorks for experimental setups."
          - "Set up and assisted with optical-flow measurements during wind-tunnel experiments."
          - "Designed and implemented a PID controller for regulating air speed in an accelerating-flow wind tunnel."

    Projects:
      - name: Safety-Critical Control in Nonlinear Systems
        start_date: 2025-01
        end_date: Present
        summary: >
          Developed safety-critical controllers for uncertain and output-feedback
          nonlinear systems with theoretical stability and safety guarantees.
        highlights:
          - "Used Lyapunov theory to establish safety and stability."
          - "Validated controllers in MATLAB, Python, and Gazebo."
          - "Implemented controllers on holonomic robots and quadcopters using ROS 2."
          - "Performed comparative studies against foundational safety-critical control methods."

      - name: Online Adaptive Control with Non-Smooth l1 Regularization
        start_date: 2025-01
        end_date: Present
        summary: >
          Developed adaptive-control methods that use sparsity-inducing l1
          regularization to reduce the number of active basis functions.
        highlights:
          - "Used non-smooth Lyapunov analysis."
          - "Validated the methods in MATLAB and Python."
          - "Led preparation of the IEEE CDC 2026 manuscript."
          - "Contributed to a related IEEE Transactions on Automatic Control manuscript using Memory Regressor Extension."

      - name: Scalar Field Mapping Using Gaussian Processes and Hough Transform
        start_date: 2025-01
        end_date: 2026-05
        summary: >
          Developed and experimentally validated ROS 2 workflows for
          safety-aware scalar-field mapping using nonholonomic ground robots.
        highlights:
          - "Developed a waypoint-navigation workflow for nonholonomic ground robots."
          - "Validated the method experimentally using light-intensity mapping while avoiding high-intensity regions."
          - "Developed ROS 2 workflows that became common starting points for laboratory experiments."
          - "Contributed to manuscript preparation for IEEE Transactions on Control Systems Technology."

