  label: Aerospace Engineer | Control Theory Researcher
  email: t.satharasi@ufl.edu
  location: Gainesville, FL
  image: ""
  summary: >
    Aerospace engineering researcher interested in mathematically rigorous control,
    nonlinear and adaptive control, safety-critical control, system identification,
    and learning-based methods for aerospace and robotic systems. My work focuses on
    developing analytical methods with provable stability, safety, and convergence
    guarantees, together with simulation and experimental validation.

