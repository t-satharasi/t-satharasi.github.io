# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title:
first_name: Trivikram
middle_name:
last_name: Satharasi

contact_note: >

description: >
  Personal academic website of Trivikram Satharasi. Research interests include
  nonlinear control, adaptive control, safety-critical control, system
  identification, and mathematically rigorous methods for control systems.

keywords: nonlinear control, adaptive control, safety-critical control, aerospace engineering, control theory

lang: en
icon: ⚛️
apple_touch_icon:

url: https://t-satharasi.github.io
baseurl: ""

last_updated: false
impressum_path:
back_to_top: true


# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark

protect_email: false

repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed

external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app


# -----------------------------------------------------------------------------
# al-folio API
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1

  style_engine: tailwind

  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css

  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false

  features:
    cv:
      enabled: true
    distill:
      enabled: true

  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0

  upgrade:
    channel: stable
    auto_apply_safe_fixes: false


# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

search_enabled: true
socials_in_search: true
posts_in_search: false
bib_search: true

max_width: 930px


# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image:


# -----------------------------------------------------------------------------
# Analytics and search verification
# -----------------------------------------------------------------------------

analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:

enable_simple_analytics: false

google_site_verification:
bing_site_verification:


# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint:


# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true

  news:
    defaults:
      layout: post
    output: true

  projects:
    output: true


# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

  syntax_highlighter_opts:
    css_class: "highlight"

    span:
      line_numbers: false

    block:
      line_numbers: false
      start_line: 1


# -----------------------------------------------------------------------------
# Includes / excludes
# -----------------------------------------------------------------------------

include: ["_pages"]

exclude:
  - AGENTS.md
  - al-folio-upgrade-report.md
  - bin/
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor

keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core


# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl


# -----------------------------------------------------------------------------
# Sitemap
# -----------------------------------------------------------------------------

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false


# -----------------------------------------------------------------------------
# Sass
# -----------------------------------------------------------------------------

sass:
  style: compressed


# -----------------------------------------------------------------------------
# Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true


# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Satharasi]
  first_name: [Trivikram]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending


# -----------------------------------------------------------------------------
# Publication display
# -----------------------------------------------------------------------------

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
  inspirehep: true

filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: true


# -----------------------------------------------------------------------------
# External links
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:


# -----------------------------------------------------------------------------
# Responsive images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true

  widths:
    - 480
    - 800
    - 1400

  input_directories:
    - assets/img/

  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"

  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true


# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false

enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true

enable_navbar_social: false

enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false


# -----------------------------------------------------------------------------
# External JSON data
# -----------------------------------------------------------------------------

jekyll_get_json:
  - data: resume
    json: assets/json/resume.json

jsonresume:
  - basics
  - work
  - education
  - publications
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references